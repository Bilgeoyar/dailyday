<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LifeQuest Parola Yapılandırıcı</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f4fb;color:#222138;font-family:system-ui,sans-serif}main{width:min(700px,100%);padding:30px;border:1px solid #e4e1ee;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(57,45,106,.1)}h1{margin-top:0}label{display:block;margin:18px 0 7px;font-weight:700}input,button,textarea{width:100%;box-sizing:border-box;font:inherit;border-radius:10px}input{height:46px;padding:0 12px;border:1px solid #d8d4e5}button{height:46px;margin-top:12px;border:0;color:#fff;background:#6657d9;font-weight:800;cursor:pointer}textarea{min-height:230px;margin-top:18px;padding:14px;border:1px solid #d8d4e5;font-family:ui-monospace,monospace;font-size:.82rem}p{color:#6d6a7e;line-height:1.55}.warning{padding:12px;border-radius:10px;background:#fff4df;color:#79531d}
  </style>
</head>
<body>
<main>
  <h1>Parola yapılandırıcı</h1>
  <p>Yeni parolanız için PBKDF2-SHA-256 doğrulama değeri üretir. Çıktıyı <code>auth-config.js</code> dosyasının tamamı yerine koyun.</p>
  <p class="warning">Parolayı değiştirmeden önce uygulamadaki şifreli yedeği dışa aktarın. Eski kayıt, yeni parolayla açılamaz.</p>
  <label for="newPassword">Yeni parola</label>
  <input id="newPassword" type="password" minlength="12" autocomplete="new-password">
  <label for="iterations">PBKDF2 tur sayısı</label>
  <input id="iterations" type="number" value="310000" min="200000" step="10000">
  <button id="generate">Yapılandırmayı üret</button>
  <textarea id="output" readonly placeholder="Çıktı burada görünecek"></textarea>
</main>
<script>
const enc=new TextEncoder();
const b64=bytes=>{let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)};
document.querySelector('#generate').addEventListener('click',async()=>{
 const password=document.querySelector('#newPassword').value;
 const iterations=Number(document.querySelector('#iterations').value);
 if(password.length<12){alert('En az 12 karakter kullanın.');return;}
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations},material,512));
 const verifier=bits.slice(0,32);
 document.querySelector('#output').value=`// Parola değişikliği için tools/password-generator.html dosyasını kullanın.\nwindow.LIFEQUEST_AUTH = Object.freeze({\n  version: 1,\n  salt: "${b64(salt)}",\n  iterations: ${iterations},\n  verifier: "${b64(verifier)}",\n  inactivityMinutes: 20\n});\n`;
 document.querySelector('#newPassword').value='';
});
</script>
</body>
</html>
